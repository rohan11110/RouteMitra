services:
  postgres:
    image: postgres:17-alpine
    container_name: routemitra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: routemitra
      POSTGRES_PASSWORD: routemitra_local_only
      POSTGRES_DB: routemitra
    ports:
      - "5434:5432"
    volumes:
      - routemitra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routemitra -d routemitra"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  routemitra_postgres_data:
